name: 'Deployagram: Flush to Cloud'
description: 'Tells the Deployagram Collector to push its captured test run for a container up to Deployagram Cloud.'
author: 'deployagram'

inputs:
  container:
    description: 'Container name under test (e.g. BookOverflow)'
    required: true
  collector-url:
    description: 'Base URL of the running Deployagram Collector. Defaults to $DEPLOYAGRAM_COLLECTOR_URL (set by the setup action) or http://localhost:1152'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Flush to cloud
      shell: bash
      env:
        CONTAINER: ${{ inputs.container }}
        INPUT_COLLECTOR_URL: ${{ inputs.collector-url }}
      run: |
        set -euo pipefail
        URL="${INPUT_COLLECTOR_URL:-${DEPLOYAGRAM_COLLECTOR_URL:-http://localhost:1152}}"

        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
          "${URL}/run/flushToCloud/${CONTAINER}")

        echo "Status code: ${STATUS}"
        if [[ "${STATUS}" -lt 200 || "${STATUS}" -ge 300 ]]; then
          echo "❌ flushToCloud failed with status ${STATUS}" >&2
          exit 1
        fi
