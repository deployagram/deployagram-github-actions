name: 'Deployagram: Mark Test Run Complete'
description: 'Tells the Deployagram Collector that a test run has finished, so its captured logs can be flushed later.'
author: 'deployagram'

inputs:
  container:
    description: 'Container name under test (e.g. BookOverflow)'
    required: true
  test-run-id:
    description: 'Identifier for this test run (e.g. github.run_number)'
    required: true
  collector-url:
    description: 'Base URL of the running Deployagram Collector. Defaults to $DEPLOYAGRAM_COLLECTOR_URL (set by the setup action) or http://localhost:1152'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Mark test run complete
      shell: bash
      env:
        CONTAINER: ${{ inputs.container }}
        TEST_RUN_ID: ${{ inputs.test-run-id }}
        INPUT_COLLECTOR_URL: ${{ inputs.collector-url }}
      run: |
        set -euo pipefail
        URL="${INPUT_COLLECTOR_URL:-${DEPLOYAGRAM_COLLECTOR_URL:-http://localhost:1152}}"

        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
          "${URL}/run/markComplete/${CONTAINER}/${TEST_RUN_ID}")

        echo "Status code: ${STATUS}"
        if [[ "${STATUS}" -lt 200 || "${STATUS}" -ge 300 ]]; then
          echo "❌ markComplete failed with status ${STATUS}" >&2
          exit 1
        fi
